<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A clean Europe trip itinerary with daily plans, booked activities, and travel days."
    />
    <title>Europe</title>
    <link rel="preload" href="styles.css?v=20260815-11" as="style" />
    <link rel="stylesheet" href="styles.css?v=20260815-11" />
  </head>
  <body>
    <a class="skip-link" href="#itinerary">Skip to itinerary</a>

    <header class="site-header">
      <div class="header-inner">
        <div class="header-copy">
          <p class="eyebrow">9 Sep - 2 Oct</p>
          <h1>Europe</h1>
          <div class="header-actions">
            <button class="view-button" id="show-wheel" type="button">Spin wheel</button>
          </div>
        </div>

        <figure class="route-figure">
          <img
            src="dolomites.jpg"
            alt="Mountain view in the Dolomites"
            width="560"
            height="360"
          />
        </figure>
      </div>
    </header>

    <nav class="topbar" id="itinerary-nav" aria-label="Itinerary navigation">
      <div class="topbar-inner">
        <div class="city-links" id="city-links"></div>
      </div>
    </nav>

    <main id="itinerary" class="page-shell">
      <div id="cities" class="cities" aria-live="polite"></div>
    </main>

    <section class="page-shell wheel-page" id="wheel-page" hidden aria-labelledby="wheel-title">
      <div class="wheel-top">
        <div>
          <p class="eyebrow">Decision wheel</p>
          <h2 id="wheel-title">Spin</h2>
        </div>
        <button class="view-button secondary" id="show-itinerary" type="button">Itinerary</button>
      </div>

      <div class="wheel-layout">
        <div class="wheel-stage" aria-label="Decision wheel">
          <div class="wheel-pointer" aria-hidden="true"></div>
          <div class="wheel-disc" id="wheel-disc">
            <div class="wheel-labels" id="wheel-labels"></div>
          </div>
        </div>

        <div class="wheel-controls">
          <label class="wheel-input-label" for="wheel-options">Options</label>
          <textarea class="wheel-options" id="wheel-options" rows="5">Liam
Raymond
Remy</textarea>
          <p class="wheel-result" id="wheel-result" aria-live="polite">Ready</p>
          <button class="spin-button" id="spin-wheel" type="button">Spin</button>
        </div>
      </div>
    </section>

    <div class="result-modal" id="result-modal" hidden role="dialog" aria-modal="true" aria-labelledby="result-modal-title">
      <div class="result-modal-backdrop"></div>
      <div class="result-modal-panel">
        <p class="eyebrow">Selected</p>
        <h2 id="result-modal-title">Result</h2>
        <p class="result-modal-name" id="result-modal-name"></p>
        <div class="result-modal-actions">
          <button class="view-button secondary" id="close-result" type="button">Close</button>
          <button class="view-button" id="remove-result" type="button">Remove</button>
        </div>
      </div>
    </div>

    <script src="app.js?v=20260815-11" defer></script>
  </body>
</html>
